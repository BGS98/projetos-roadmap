<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>
    <header>
        <img src="imagens/favicon.ico" alt="Logo do Site">
        <h3 id="autor">Bruno Santos</h3>
        <nav>
            <a href="index.html">Pagina Inicial / </a>
            <a href="projetos.html">Projetos / </a>
            <a href="artigos.html">Artigos / </a>
            <a href="contato.html">Contato</a>
        </nav>
        <h1>Estudante Frontend</h1>
        <p>Página simples com boa estruturação</p>
    </header>
    
    <main>
        <article>
            <h2>Deixe sua mensagem</h2>

            <div id="formulario">
                <form action="@" method="get">
                    <label for="name">Nome:</label>
                    <input type="text" name="name" id="name" required placeholder="obrigatório"><br>
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" placeholder="opcional"> <br>
                    <label for="mensagem">Sua mensagem:</label><br>
                    <textarea name="mensagem" id="mensagem" cols="30" rows="10"></textarea><br>
                    <input type="submit" value="Enviar">
                </form>
            </div>
        </article>
    </main>
</body>
</html>
