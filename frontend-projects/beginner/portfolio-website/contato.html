        <p>Página simples somente HTML com boa estruturação</p>
        <hr>

    <main>
        <h2>Deixe sua mensagem</h2>
        <form action="@" method="get">
            <label for="name">Nome:</label>
            <input type="text" name="name" id="name" required placeholder="obrigatório">

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="opcional"> <br>

            <label for="mensagem">Sua mensagem:</label><br>
            <textarea name="mensagem" id="mensagem" cols="30" rows="10"></textarea><br>

            <input type="submit" value="Enviar">
        </form>
    </main>
</body>
</html>
